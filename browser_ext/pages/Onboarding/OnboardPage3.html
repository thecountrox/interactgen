<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flow State Onboarding - Success</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols (CRITICAL: Exact string required) -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#22C55E", // Vibrant Neon Green requested
              "background-light": "#f6f8f7",
              "background-dark": "#020904", // Deep Forest Black requested
              "surface-card": "#0D1F12", // Dark Moss Green requested
              "surface-inner": "#050B06", // Very dark container
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "1rem", 
              "lg": "2rem", 
              "xl": "3rem", 
              "full": "9999px"
            },
            boxShadow: {
                "neon": "0 0 20px -5px rgba(34, 197, 94, 0.4)",
                "card-glow": "0 0 60px -15px rgba(34, 197, 94, 0.15)",
            }
          },
        },
      }
    </script>
<style>
        /* Custom utilities for the specific design feel */
        .glass-border {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden font-display selection:bg-primary selection:text-black">
<div class="layout-container flex h-full grow flex-col items-center justify-center p-4">
<!-- Main Card Container -->
<div class="layout-content-container flex flex-col w-full max-w-[500px]">
<!-- Card Body -->
<div class="relative flex flex-col bg-surface-card rounded-[32px] glass-border shadow-card-glow overflow-hidden">
<!-- Progress Header -->
<div class="px-8 pt-8 pb-2">
<div class="flex justify-between items-center mb-4">
<div class="flex items-center gap-2">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<p class="text-white/50 text-xs font-medium uppercase tracking-wider">Connecting...</p>
</div>
<p class="text-white/50 text-xs font-medium uppercase tracking-wider">Step 3 of 3</p>
</div>
<!-- Progress Bar -->
<div class="h-1 w-full bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full shadow-[0_0_10px_rgba(34,197,94,0.8)]" style="width: 100%;"></div>
</div>
</div>
<!-- Main Content -->
<div class="px-8 pb-10 flex flex-col items-center">
<!-- Hero Icon -->
<div class="mt-8 mb-6 relative">
<div class="absolute inset-0 bg-primary blur-2xl opacity-20 rounded-full"></div>
<div class="relative h-20 w-20 bg-primary rounded-full flex items-center justify-center shadow-neon">
<span class="material-symbols-outlined text-white text-[40px] font-bold" data-icon="check">check</span>
</div>
</div>
<!-- Headlines -->
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight text-center mb-3">Profile Created!</h1>
<p class="text-[#9CA3AF] text-base font-normal leading-relaxed text-center max-w-sm">
                        Your Flow State extension has successfully synced with your brain profile. You can close this tab now.
                    </p>
<!-- ID Field (Modified TextField) -->
<div class="w-full mt-8">
<div class="bg-surface-inner rounded-full glass-border flex items-center justify-between p-1.5 pl-6 group hover:border-primary/30 transition-colors duration-300">
<div class="flex flex-col overflow-hidden mr-2">
<label class="text-[10px] uppercase font-bold text-primary/60 tracking-widest mb-0.5">User ID</label>
<div class="font-mono text-white text-base tracking-wide truncate">FS-8921-XK-002</div>
</div>
<button class="h-11 w-11 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-[#9CA3AF] hover:text-white transition-all active:scale-95">
<span class="material-symbols-outlined text-[20px]" data-icon="content_copy">content_copy</span>
</button>
</div>
<!-- Helper Text -->
<div class="flex items-center justify-center gap-1.5 mt-3 text-[#58685e] text-xs font-medium">
<span class="material-symbols-outlined text-[14px]" data-icon="lock">lock</span>
<span>Keep this ID safe. It connects your devices.</span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full mt-10 flex flex-col gap-5">
<button class="relative w-full py-4 bg-primary hover:bg-[#1eb053] text-black font-bold text-lg rounded-full shadow-neon hover:shadow-[0_0_30px_rgba(34,197,94,0.5)] transition-all duration-300 transform active:scale-[0.99] flex items-center justify-center gap-2 group">
                            Open Dashboard
                            <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="text-[#58685e] hover:text-white text-sm font-medium transition-colors">
                            Close Tab
                        </button>
</div>
</div>
</div>
<!-- Footer Branding (Subtle) -->
<div class="mt-8 flex justify-center opacity-30">
<div class="h-1 w-12 rounded-full bg-white"></div>
</div>
</div>
</div>
</body></html>
