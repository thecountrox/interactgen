<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flow State Onboarding</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&amp;family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#36e27b",
              "background-light": "#f6f8f7",
              "background-dark": "#112117",
            },
            fontFamily: {
              "display": ["Spline Sans", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            boxShadow: {
                "glow": "0 0 20px -5px rgba(54, 226, 123, 0.3)"
            }
          },
        },
      }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-4 font-display transition-colors duration-300">
<div class="w-full max-w-[600px] flex flex-col gap-6">
<!-- Logo Header -->
<div class="flex justify-center mb-2 animate-fade-in">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-4xl">bolt</span>
<span class="text-slate-900 dark:text-white font-bold text-xl tracking-tight">Flow State</span>
</div>
</div>
<!-- Main Card -->
<div class="bg-white dark:bg-[#1a2c23] rounded-lg shadow-2xl dark:shadow-glow border border-gray-100 dark:border-[#366348]/30 p-8 sm:p-10 flex flex-col gap-8 relative overflow-hidden">
<!-- Progress Bar Section -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-end">
<p class="text-slate-500 dark:text-[#95c6a9] text-sm font-medium uppercase tracking-wider">Step 1 of 3</p>
<p class="text-slate-400 dark:text-[#95c6a9]/60 text-xs">Profile Setup</p>
</div>
<div class="h-2 w-full bg-gray-100 dark:bg-[#366348]/30 rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full shadow-[0_0_10px_rgba(54,226,123,0.5)]"></div>
</div>
</div>
<!-- Header Section -->
<div class="flex flex-col gap-2">
<h1 class="text-slate-900 dark:text-white text-3xl sm:text-4xl font-bold tracking-tight">Tell us about yourself</h1>
<p class="text-slate-500 dark:text-[#95c6a9] text-base font-normal leading-relaxed">Let's personalize your flow. How do you identify?</p>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-8">
<!-- Input Field -->
<div class="flex flex-col gap-3">
<label class="text-slate-700 dark:text-white text-sm font-semibold ml-1" for="username">Username</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-[#95c6a9] material-symbols-outlined">alternate_email</span>
<input class="w-full pl-12 pr-4 py-4 rounded-full bg-gray-50 dark:bg-[#112117] border border-gray-200 dark:border-[#366348] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#95c6a9]/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200" id="username" placeholder="FlowMaster99" type="text"/>
</div>
</div>
<!-- Selection Grid -->
<div class="flex flex-col gap-3">
<label class="text-slate-700 dark:text-white text-sm font-semibold ml-1">Technical Level</label>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
<!-- Option 1: Beginner -->
<button class="flex flex-col items-center justify-center gap-3 p-4 rounded-lg border border-gray-200 dark:border-[#366348] bg-gray-50 dark:bg-[#1b3224]/50 hover:border-primary hover:bg-primary/5 dark:hover:bg-[#1b3224] transition-all duration-200 group cursor-pointer h-32">
<span class="material-symbols-outlined text-3xl text-slate-400 dark:text-[#95c6a9] group-hover:text-primary transition-colors">spa</span>
<span class="text-slate-600 dark:text-white text-sm font-semibold group-hover:text-primary transition-colors">Beginner</span>
</button>
<!-- Option 2: Intermediate (Selected State) -->
<button class="relative flex flex-col items-center justify-center gap-3 p-4 rounded-lg border-2 border-primary bg-primary/10 dark:bg-[#1b3224] shadow-glow transition-all duration-200 cursor-pointer h-32">
<div class="absolute top-2 right-2 text-primary">
<span class="material-symbols-outlined text-lg">check_circle</span>
</div>
<span class="material-symbols-outlined text-3xl text-primary font-fill">yard</span>
<span class="text-slate-900 dark:text-white text-sm font-bold">Intermediate</span>
</button>
<!-- Option 3: Advanced -->
<button class="flex flex-col items-center justify-center gap-3 p-4 rounded-lg border border-gray-200 dark:border-[#366348] bg-gray-50 dark:bg-[#1b3224]/50 hover:border-primary hover:bg-primary/5 dark:hover:bg-[#1b3224] transition-all duration-200 group cursor-pointer h-32">
<span class="material-symbols-outlined text-3xl text-slate-400 dark:text-[#95c6a9] group-hover:text-primary transition-colors">park</span>
<span class="text-slate-600 dark:text-white text-sm font-semibold group-hover:text-primary transition-colors">Advanced</span>
</button>
<!-- Option 4: Expert -->
<button class="flex flex-col items-center justify-center gap-3 p-4 rounded-lg border border-gray-200 dark:border-[#366348] bg-gray-50 dark:bg-[#1b3224]/50 hover:border-primary hover:bg-primary/5 dark:hover:bg-[#1b3224] transition-all duration-200 group cursor-pointer h-32">
<span class="material-symbols-outlined text-3xl text-slate-400 dark:text-[#95c6a9] group-hover:text-primary transition-colors">forest</span>
<span class="text-slate-600 dark:text-white text-sm font-semibold group-hover:text-primary transition-colors">Expert</span>
</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col sm:flex-row items-center gap-4 mt-4 pt-4 border-t border-gray-100 dark:border-[#366348]/20">
<button class="w-full sm:w-auto text-slate-500 dark:text-[#95c6a9] hover:text-slate-900 dark:hover:text-white font-medium text-sm py-3 px-6 rounded-full transition-colors order-2 sm:order-1">
                    Skip for now
                </button>
<button class="w-full flex-1 bg-primary hover:bg-emerald-400 text-[#0c1f15] font-bold text-base py-4 px-8 rounded-full shadow-lg hover:shadow-primary/40 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 order-1 sm:order-2">
                    Continue
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
